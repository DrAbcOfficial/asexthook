name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      asext_sha:
        type: string
        default: ''
      metamod_sha:
        type: string
        default: ''
      release_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==23.1.3
      - run: cmake -S . -B build/format -DFORMAT_VALIDATION_ONLY=ON
      - run: cmake --build build/format --target format-check

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        config: ${{ fromJSON(inputs.release_only && '["Release"]' || '["Debug", "Release"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require both candidate commits
        if: (inputs.asext_sha == '') != (inputs.metamod_sha == '')
        run: exit 1
      - name: Select candidate dependencies
        if: inputs.asext_sha != '' && inputs.metamod_sha != ''
        env:
          ASEXT_SHA: ${{ inputs.asext_sha }}
          METAMOD_SHA: ${{ inputs.metamod_sha }}
        shell: bash
        run: python scripts/upstream.py checkout --asext-sha "$ASEXT_SHA" --metamod-sha "$METAMOD_SHA"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - if: runner.os == 'Windows'
        run: cmake -S . -B build/x86/${{ matrix.config }} -A Win32
      - if: runner.os == 'Linux'
        run: cmake -S . -B build/x86/${{ matrix.config }} -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - run: cmake --build build/x86/${{ matrix.config }} --config ${{ matrix.config }} --parallel 4
      - run: ctest --test-dir build/x86/${{ matrix.config }} -C ${{ matrix.config }} --output-on-failure
      - run: cmake --install build/x86/${{ matrix.config }} --config ${{ matrix.config }}
      - name: Verify and package
        env:
          PACKAGE_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
        shell: bash
        run: python scripts/package.py --config '${{ matrix.config }}' --platform "$PACKAGE_PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: asexthook-${{ runner.os }}-x86-${{ matrix.config }}
          path: build/packages/*
          if-no-files-found: error
          retention-days: 14
